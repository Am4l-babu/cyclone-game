<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Cyclone Game - an ESP8266 LED arcade game">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="258" rx="17" fill="none" stroke="#0f3460"/>

  <!-- 24-LED ring with a running red LED and a green target zone -->
  <g transform="translate(130,130)" filter="url(#glow)">
    <circle r="95" fill="none" stroke="#0f3460" stroke-width="2"/>
    <g id="ledring"></g>
    <circle r="46" fill="#533483" stroke="#7a4fc9" stroke-width="3"/>
    <text x="0" y="6" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">PLAY</text>
  </g>

  <!-- 24 static LEDs, three lit as the green target zone, one lit red as the runner (animated) -->
  <g transform="translate(130,130)">
    <!-- target zone (levels 1-2 style: 3 wide, dim edges) fixed near bottom-right -->
    <circle cx="67.2" cy="-66.7" r="7" fill="#2ee66b" opacity="0.55"/>
    <circle cx="79.6" cy="-52.8" r="7" fill="#2ee66b"/>
    <circle cx="89.4" cy="-36.9" r="7" fill="#2ee66b" opacity="0.4"/>

    <!-- the rest of the ring, dim -->
    <g fill="#2a2f55">
      <circle cx="95" cy="0" r="6"/>
      <circle cx="89.4" cy="36.9" r="6"/>
      <circle cx="79.6" cy="52.8" r="6"/>  <!-- hidden behind other side visually, kept for count -->
      <circle cx="67.2" cy="66.7" r="6"/>
      <circle cx="46.5" cy="82.3" r="6"/>
      <circle cx="24.7" cy="91.7" r="6"/>
      <circle cx="0" cy="95" r="6"/>
      <circle cx="-24.7" cy="91.7" r="6"/>
      <circle cx="-46.5" cy="82.3" r="6"/>
      <circle cx="-67.2" cy="66.7" r="6"/>
      <circle cx="-79.6" cy="52.8" r="6"/>
      <circle cx="-89.4" cy="36.9" r="6"/>
      <circle cx="-95" cy="0" r="6"/>
      <circle cx="-89.4" cy="-36.9" r="6"/>
      <circle cx="-79.6" cy="-52.8" r="6"/>
      <circle cx="-67.2" cy="-66.7" r="6"/>
      <circle cx="-46.5" cy="-82.3" r="6"/>
      <circle cx="-24.7" cy="-91.7" r="6"/>
      <circle cx="0" cy="-95" r="6"/>
      <circle cx="24.7" cy="-91.7" r="6"/>
      <circle cx="46.5" cy="-82.3" r="6"/>
    </g>

    <!-- the running red LED, animated around the ring -->
    <circle r="7" fill="#ff3b3b" filter="url(#glow)">
      <animateMotion dur="3s" repeatCount="indefinite"
        path="M 95,0 A 95,95 0 1,1 94.98,-1.5 A 95,95 0 1,1 95,0 Z"/>
    </circle>
  </g>

  <!-- Title -->
  <text x="290" y="112" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#e94560" letter-spacing="1">CYCLONE</text>
  <text x="290" y="178" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#eeeeee" letter-spacing="1">GAME</text>

  <!-- score-LED gradient bar under the title -->
  <g>
    <rect x="290" y="196" width="46" height="6" rx="3" fill="#2ee66b"/>
    <rect x="342" y="196" width="46" height="6" rx="3" fill="#8fd13f"/>
    <rect x="394" y="196" width="46" height="6" rx="3" fill="#ffd23f"/>
    <rect x="446" y="196" width="46" height="6" rx="3" fill="#ff9f3f"/>
    <rect x="498" y="196" width="46" height="6" rx="3" fill="#ff6b3f"/>
    <rect x="550" y="196" width="46" height="6" rx="3" fill="#e94560"/>
  </g>

  <text x="290" y="228" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#8fa3c7">ESP8266  ·  WS2812B x24  ·  WiFi Web UI  ·  6 Levels</text>
</svg>
